<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token Meter</title>
<style>
:root{--bg:#F7F8F6;--ink:#16191D;--mut:#5F6873;--rule:#DADDD6;--card:#fff;--soft:#E7E9E3;--claude:#B85C3A;--claudeF:#D97757;--gpt:#12876A;--gptF:#19A37F;--warn:#F0B429;--crit:#F04E4E;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:#14171B;color:#ECEFF3;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.top b{font-weight:600;font-size:15px;letter-spacing:.02em;display:block}.top small{font:11px var(--mono);color:#98A1AB}
.pill{font:10.5px var(--mono);padding:3px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ap{background:#3A2E0A;color:#F0B429}.pill.ok{background:#0F3A2C;color:#3ED3A2}.pill.bad{background:#3A1414;color:#F08080}
main{max-width:520px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}.help{margin:0;color:var(--mut);font-size:13px}.help code,.kv code{background:var(--soft);padding:1px 5px;border-radius:3px;font:12px var(--mono)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:3px;border-radius:2px;background:var(--rule)}.steps i.on{background:var(--ink)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.list{border:1px solid var(--rule);border-radius:10px;background:#fff;overflow:hidden}.it{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid #ECEEE9;cursor:pointer}.it:first-child{border-top:0}.it.sel{background:#FFF6DE}.it .rs{font:11px var(--mono);color:var(--mut)}
label{font-size:12.5px;font-weight:500;color:#3B424B;display:block;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid #C9CDC5;border-radius:8px;background:#fff;padding:10px 12px;font:13px var(--mono);color:var(--ink)}textarea{min-height:96px;resize:vertical}input[type=number]{width:90px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid #B77A00;outline-offset:1px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.btns{display:flex;gap:10px;margin-top:4px}
button{padding:12px 16px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid #C9CDC5;background:#fff;color:var(--ink);cursor:pointer;flex:1}button.p{background:var(--ink);color:#fff;border-color:var(--ink)}button.g{border:0;background:none;color:var(--mut);flex:0 0 auto}button.d{color:#B42318;border-color:#E9C2BD}button:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;padding:8px 10px;border-radius:8px}.msg.ok{background:#E6F5EE;color:#167A5C}.msg.err{background:#FBE9E7;color:#B42318}.msg.warn{background:#FFF6DE;color:#8A5A00}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px}.tabs span{flex:1;text-align:center;padding:6px;font-size:12.5px;border-radius:8px;color:var(--mut);cursor:pointer}.tabs span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hd{display:flex;justify-content:space-between;align-items:baseline}.hd b{font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}.hd span{font:11px var(--mono);color:var(--mut)}
.wrow{display:grid;grid-template-columns:34px 1fr 42px 76px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}.wrow .w{font:11px var(--mono);color:var(--mut)}.wrow .t{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.wrow .t i{display:block;height:100%;border-radius:4px;transition:width .4s}.wrow .p{text-align:right;font-weight:600;font-size:15px}.wrow .r{font:11px var(--mono);color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:13px}.kv span:nth-child(2n){font:12px var(--mono);text-align:right;color:#3B424B}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #ECEEE9;font-size:13.5px}.set:first-child{border-top:0}.set .d{color:var(--mut);font-size:12px}.set .val{font:12px var(--mono);background:var(--soft);padding:3px 8px;border-radius:6px}.set input[type=number],.set select{width:auto;padding:6px 8px}
.tog{width:36px;height:20px;border-radius:10px;background:var(--ink);position:relative;flex:none;cursor:pointer}.tog::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}.tog.off{background:#C9CDC5}.tog.off::after{right:auto;left:2px}
.hide{display:none!important}.mut{color:var(--mut)}
</style></head><body>
<div class="top"><div><b>Token Meter</b><small id="sub">…</small></div><span class="pill" id="pill"><i></i><span id="pilltxt">…</span></span></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok&&!j.error)j.error='HTTP '+r.status;return j};
let S={},C={},view=null,step=0,scan=[],pickSsid='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cd=t=>{if(!t)return'';let d=t-S.now;if(d<=0)return'now';if(d>=86400)return`↻ ${Math.floor(d/86400)}d ${Math.floor(d%86400/3600)}h`;if(d>=3600)return`↻ ${Math.floor(d/3600)}h ${String(Math.floor(d%3600/60)).padStart(2,'0')}m`;return`↻ ${Math.floor(d/60)}m`};
const ago=t=>{if(!t)return'never';let d=S.now-t;return d<60?d+' s ago':d<3600?Math.floor(d/60)+' m ago':Math.floor(d/3600)+' h ago'};
const col=(p,base)=>p>=C.crit_pct?'var(--crit)':p>=C.warn_pct?'var(--warn)':base;

function header(){const net=S.net||'…';$('#sub').textContent=net==='online'?`${S.ip} · ${S.ssid} ${S.rssi} dBm`:net==='provision'?`${S.ap_ssid} · setup`:net==='fallback'?`offline · hotspot ${S.ap_ssid}`:net==='connecting'?`connecting to ${S.ssid}…`:'…';
 const p=$('#pill');p.className='pill '+(net==='online'?'ok':net==='connecting'?'ap':net==='fallback'?'bad':'ap');$('#pilltxt').textContent=net==='online'?'ONLINE':net==='connecting'?'CONNECTING':net==='fallback'?'OFFLINE':'HOTSPOT'}

let alive=false;async function refresh(){try{S=await api('GET','/api/status');C=await api('GET','/api/config');alive=true}catch(e){alive=false}header();if(!alive){if(view===null){$('#app').innerHTML='<div class="card"><h2>Device not reachable</h2><p class="help">Retrying… if you just changed WiFi, reconnect your phone to the same network as the device (or to its hotspot).</p></div>'}return}if(view===null){const h=location.hash.slice(1);view=(!C.wifi_ssid||h==='setup')?'wiz':['usage','settings','status'].includes(h)?h:'usage'}render()}

function render(){const a=$('#app');if(view==='wiz')return wiz(a);a.innerHTML=`<div class="tabs">${['usage','settings','status'].map(v=>`<span class="${view===v?'on':''}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</span>`).join('')}</div><div id="body"></div>`;a.querySelectorAll('.tabs span').forEach(s=>s.onclick=()=>{view=s.dataset.v;location.hash=view;render()});({usage,settings,status})[view]($('#body'))}

function provCard(key,name,base,plan){const p=S[key];if(!p||!p.enabled)return'';let rows='';if(p.ok||p.fetched_at){rows=(p.windows||[]).map(w=>`<div class="wrow"><span class="w">${esc(w.label)}</span><div class="t"><i style="width:${Math.min(100,w.pct)}%;background:${col(w.pct,base)}"></i></div><span class="p">${Math.round(w.pct)}%</span><span class="r">${cd(w.resets_at)}</span></div>`).join('')}
 const err=!p.ok&&p.error?`<div class="msg err">${esc(p.error)}${p.next_poll?` · retry ${cd(p.next_poll).replace('↻','in')}`:''}</div>`:'';
 return`<div class="card"><div class="hd"><b style="color:${base==='var(--claudeF)'?'var(--claude)':'var(--gpt)'}">${name}</b><span>${esc(p.plan||plan)} · fetched ${ago(p.fetched_at)}</span></div>${rows}${err}</div>`}

function usage(el){const none=!(S.claude?.enabled||S.openai?.enabled);el.innerHTML=(none?`<div class="card"><h2>No providers yet</h2><p class="help">Sign in with Claude or add ChatGPT auth.json in Settings — or <a href="#setup" onclick="view='wiz';step=1;render();return false">run the setup wizard</a>.</p></div>`:'')+provCard('claude','Claude','var(--claudeF)','Claude')+provCard('openai','ChatGPT','var(--gptF)','ChatGPT')+
 `<div class="card" style="gap:6px"><div class="hd"><b>Device</b><span>uptime ${Math.floor(S.uptime_s/3600)}h ${Math.floor(S.uptime_s%3600/60)}m</span></div><div class="kv"><span>Free heap</span><span>${Math.round(S.heap_free/1024)} KB (min ${Math.round(S.heap_min/1024)})</span><span>Next poll</span><span>${S.claude?.enabled?'Claude '+cd(S.claude.next_poll).replace('↻','')+' · ':''}${S.openai?.enabled?'GPT '+cd(S.openai.next_poll).replace('↻',''):''}</span><span>SD card</span><span>${S.sd?.mounted?Math.round(S.sd.used_kb/1024)+' / '+Math.round(S.sd.total_kb/1024)+' MB':'none'}</span></div></div>`}

function status(el){const rows=[['State',S.net],['WiFi',`${S.ssid||'—'} · ${S.rssi||0} dBm`],['IP',S.ip||'—'],['Hotspot',S.ap_ssid],['Time synced',S.time_synced?'yes · '+new Date(S.now*1000).toLocaleTimeString():'no'],['Uptime',`${Math.floor(S.uptime_s/86400)}d ${Math.floor(S.uptime_s%86400/3600)}h ${Math.floor(S.uptime_s%3600/60)}m`],['Free heap',`${Math.round(S.heap_free/1024)} KB (low-water ${Math.round(S.heap_min/1024)} KB)`],['SD card',S.sd?.mounted?`${Math.round(S.sd.used_kb/1024)} / ${Math.round(S.sd.total_kb/1024)} MB used`:'not mounted'],['Firmware','v'+S.version],
 ['Claude',S.claude?.enabled?(S.claude.ok?'ok · fetched '+ago(S.claude.fetched_at):'ERROR '+S.claude.error):'not configured'],['ChatGPT',S.openai?.enabled?(S.openai.ok?'ok · fetched '+ago(S.openai.fetched_at):'ERROR '+S.openai.error):'not configured']];
 el.innerHTML=`<div class="card"><div class="hd"><b>Device</b><span>refreshes every 5 s</span></div><div class="kv">${rows.map(([k,v])=>`<span>${k}</span><span>${esc(v)}</span>`).join('')}</div></div><div class="card"><div class="hd"><b>Raw /api/status</b><span>what the LCD sees</span></div><pre style="margin:0;font:11px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all;color:#3B424B">${esc(JSON.stringify(S,null,1))}</pre></div>`}
function tog(id,on){return`<span class="tog ${on?'':'off'}" data-t="${id}"></span>`}
function settings(el){el.innerHTML=`
<div class="card" style="gap:0">
 <div class="set"><div>WiFi network<div class="d">${esc(C.wifi_ssid)||'not set'}</div></div><button class="g" id="wifiEdit">change</button></div>
 <div class="set"><div>Claude token<div class="d">${C.has_claude?esc(C.claude_masked)+(C.claude_has_refresh?' · refresh ok':' · <b>no refresh</b>')+(C.claude_access_exp?' · exp '+cd(C.claude_access_exp).replace('↻','in'):'')+' · <u id="rmClaude" style="cursor:pointer">remove</u>':'not set'}</div></div><button class="g" id="edClaude">${C.has_claude?'replace':'add'}</button></div>
 <div class="set"><div>ChatGPT tokens<div class="d">${C.has_openai?esc(C.openai_account.slice(0,12))+'… · token exp '+(C.openai_access_exp?cd(C.openai_access_exp).replace('↻','in'):'?')+' · <u id="rmOpenai" style="cursor:pointer">remove</u>':'not set'}</div></div><button class="g" id="edOpenai">${C.has_openai?'replace':'add'}</button></div>
</div>
<div id="editor"></div>
<div class="card" style="gap:0">
 <div class="set"><div>Poll interval<div class="d">Claude ≥120 s · ChatGPT ≥60 s</div></div><div class="row"><input type="number" id="poll_claude_s" value="${C.poll_claude_s}" min="120" max="3600"><input type="number" id="poll_openai_s" value="${C.poll_openai_s}" min="60" max="3600"></div></div>
 <div class="set"><div>Warn / critical at %</div><div class="row"><input type="number" id="warn_pct" value="${C.warn_pct}" min="1" max="99"><input type="number" id="crit_pct" value="${C.crit_pct}" min="2" max="100"></div></div>
 <div class="set"><div>Brightness<div class="d">max 50 % (panel limit)</div></div><input type="number" id="brightness" value="${C.brightness}" min="1" max="50"></div>
 <div class="set"><div>Night dim<div class="d"><input type="number" id="night_start_h" value="${C.night_start_h}" min="0" max="23" style="width:64px"> – <input type="number" id="night_end_h" value="${C.night_end_h}" min="0" max="23" style="width:64px"> h → <input type="number" id="night_brightness" value="${C.night_brightness}" min="0" max="50" style="width:64px"> %</div></div>${tog('night_dim',C.night_dim)}</div>
 <div class="set"><div>Status LED mirrors worst gauge</div>${tog('led_enabled',C.led_enabled)}</div>
 <div class="set"><div>LED off at night<div class="d">uses the night hours above</div></div>${tog('led_night_off',C.led_night_off)}</div>
 <div class="set"><div>Log to SD card<div class="d">/usage.csv every poll${S.sd?.mounted?'':' · no card detected'}</div></div>${tog('sd_log',C.sd_log)}</div>
 <div class="set"><div>Timezone<div class="d">POSIX TZ string</div></div><select id="tz">${['UTC0','EST5EDT,M3.2.0,M11.1.0','CST6CDT,M3.2.0,M11.1.0','MST7MDT,M3.2.0,M11.1.0','MST7','PST8PDT,M3.2.0,M11.1.0','AKST9AKDT,M3.2.0,M11.1.0','HST10','GMT0BST,M3.5.0/1,M10.5.0','CET-1CEST,M3.5.0,M10.5.0/3','EET-2EEST,M3.5.0/3,M10.5.0/4','IST-5:30','JST-9','AEST-10AEDT,M10.1.0,M4.1.0/3','NZST-12NZDT,M9.5.0,M4.1.0/3'].map(z=>`<option ${z===C.tz?'selected':''}>${z}</option>`).join('')}</select></div>
 <div class="set"><div>Rotation<div class="d">takes effect after reboot</div></div><select id="rotation"><option value="0" ${C.rotation==0?'selected':''}>USB right</option><option value="1" ${C.rotation==1?'selected':''}>USB left</option></select></div>
 <div class="btns"><button class="p" id="save">Save settings</button></div><div id="savemsg"></div>
</div>
<div class="card" style="gap:0"><div class="set"><div style="color:#B42318;font-weight:500">Factory reset<div class="d">wipes WiFi + tokens, back to setup mode</div></div><button class="d" id="reset" style="flex:0 0 auto">hold 3 s</button></div>
<div class="set"><div>Reboot</div><button class="g" id="reboot">reboot</button></div></div>`;
 el.querySelectorAll('.tog').forEach(t=>t.onclick=()=>t.classList.toggle('off'));
 $('#save').onclick=async()=>{const b={};['poll_claude_s','poll_openai_s','warn_pct','crit_pct','brightness','night_start_h','night_end_h','night_brightness'].forEach(k=>b[k]=+$('#'+k).value);['night_dim','led_enabled','led_night_off','sd_log'].forEach(k=>b[k]=!el.querySelector(`[data-t=${k}]`).classList.contains('off'));b.tz=$('#tz').value;b.rotation=+$('#rotation').value;C=await api('POST','/api/config',b);$('#savemsg').innerHTML='<div class="msg ok">Saved</div>'};
 $('#wifiEdit').onclick=()=>{view='wiz';step=1;render()};
 $('#edClaude').onclick=()=>claudeEditor($('#editor'));$('#edOpenai').onclick=()=>openaiEditor($('#editor'));
 const rc=$('#rmClaude');if(rc)rc.onclick=async()=>{if(confirm('Remove the Claude token?')){await api('DELETE','/api/claude');refresh()}};
 const ro=$('#rmOpenai');if(ro)ro.onclick=async()=>{if(confirm('Remove the ChatGPT tokens?')){await api('DELETE','/api/openai');refresh()}};
 let hold;$('#reset').onmousedown=$('#reset').ontouchstart=()=>{hold=setTimeout(async()=>{await api('POST','/api/reset');alert('Resetting — join the hotspot shown on the display.')},3000)};$('#reset').onmouseup=$('#reset').onmouseleave=$('#reset').ontouchend=()=>clearTimeout(hold);
 $('#reboot').onclick=()=>api('POST','/api/reboot')}

function claudeEditor(el,next){el.innerHTML=`<div class="card"><h2>Claude subscription</h2><p class="help">Give the device its <b>own</b> Claude login. It gets a separate refresh token, so it can't be knocked out when Claude Code on your computer refreshes (and vice-versa).</p>
<ol class="help" style="margin:0 0 4px 18px;padding:0"><li>Tap <b>Open sign-in</b> and log in with your Claude account.</li><li>The page ends on a code — copy the whole thing (it looks like <code>xxxxxxxx#yyyyyyyy</code>).</li><li>Paste it below.</li></ol>
<div class="btns" style="margin-top:0"><button class="s" id="coauth">Open sign-in</button><span id="curl" class="help"></span></div>
<label>Code from the sign-in page</label><textarea id="ccode" rows="2" placeholder="paste the code#state here"></textarea>
<div id="cmsg"></div><div class="btns">${next?'<button class="g" id="cskip">Skip</button>':''}<button class="g" id="cadv">Paste credentials.json instead…</button><button class="p" id="cgo">Verify${next?' & continue':' & save'}</button></div>
<div id="cadvbox" style="display:none"><p class="help" style="color:#8A5A00;margin-top:10px">Fallback: paste <code>~/.claude/.credentials.json</code>. This shares your desktop login — when either side refreshes, the other stops working until re-pasted.</p><label>credentials.json</label><textarea id="ctok" placeholder='{"claudeAiOauth":{"accessToken":"sk-ant-oat01-…","refreshToken":"…","expiresAt":…}}'></textarea><div class="btns"><button class="p" id="cgo2">Verify credentials.json</button></div></div></div>`;
 $('#coauth').onclick=async()=>{$('#coauth').disabled=true;const r=await api('GET','/api/claude/oauth/start');$('#coauth').disabled=false;if(!r.ok){$('#cmsg').innerHTML='<div class="msg err">'+esc(r.error||'failed')+'</div>';return}window.open(r.url,'_blank');$('#curl').innerHTML=`opened — or <a href="${r.url}" target="_blank" rel="noopener">use this link</a>`};
 $('#cadv').onclick=()=>{$('#cadvbox').style.display='block';$('#cadv').style.display='none'};
 const done=(r)=>{$('#cgo').disabled=false;const g=$('#cgo2');if(g)g.disabled=false;if(r.ok){const w=r.usage.windows||[];$('#cmsg').innerHTML=`<div class="msg ok">Signed in · ${esc(r.usage.plan||'')} · 5 h ${Math.round(w[0]?.pct??0)} % used</div>`;if(next)setTimeout(next,700);else refresh()}else $('#cmsg').innerHTML=`<div class="msg err">${esc(r.error)}</div>`};
 $('#cgo').onclick=async()=>{const code=$('#ccode').value.trim();if(!code){$('#cmsg').innerHTML='<div class="msg err">Paste the code first (or use the credentials.json fallback).</div>';return}$('#cgo').disabled=true;$('#cmsg').innerHTML='<div class="msg warn">Exchanging code with Anthropic…</div>';done(await api('POST','/api/claude/oauth/finish',{code}))};
 $('#cgo2').onclick=async()=>{$('#cgo2').disabled=true;$('#cmsg').innerHTML='<div class="msg warn">Checking with Anthropic…</div>';const raw=$('#ctok').value.trim();done(await api('POST','/api/claude',raw.startsWith('{')?{credjson:raw}:{token:raw}))};
 if(next)$('#cskip').onclick=next}

function openaiEditor(el,next){el.innerHTML=`<div class="card"><h2>ChatGPT (Codex) subscription</h2><p class="help">Paste the contents of <code>~/.codex/auth.json</code>. The device keeps the tokens in flash and refreshes them itself.</p><label>auth.json</label><textarea id="oaj" placeholder='{"tokens":{"access_token":"…","refresh_token":"…","account_id":"…"}}'></textarea><p class="help" style="color:#8A5A00">Heads-up: refresh tokens rotate, so your desktop Codex CLI may occasionally ask you to log in again. Cloudflare may also block the device (shows as a 403 row) — nothing else is affected.</p><div id="omsg"></div><div class="btns">${next?'<button class="g" id="oskip">Skip</button>':''}<button class="p" id="ogo">Verify${next?' & finish':' & save'}</button></div></div>`;
 $('#ogo').onclick=async()=>{$('#ogo').disabled=true;$('#omsg').innerHTML='<div class="msg warn">Checking with OpenAI…</div>';const r=await api('POST','/api/openai',{authjson:$('#oaj').value});$('#ogo').disabled=false;if(r.ok){const w=r.usage.windows||[];$('#omsg').innerHTML=`<div class="msg ok">Verified · ${esc(r.usage.plan)} · 5 h ${Math.round(w[0]?.pct??0)} % used</div>`;if(next)setTimeout(next,700);else refresh()}else $('#omsg').innerHTML=`<div class="msg err">${esc(r.error)}</div>`};
 if(next)$('#oskip').onclick=next}

async function wiz(a){if(!step&&C.wifi_ssid&&S.net==='online')step=2;const st=step||1;a.innerHTML=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div><div id="wz"></div>`;const el=$('#wz');
 if(st===1){el.innerHTML=`<div class="card"><h2>Connect to your WiFi</h2><p class="help">Pick your home network. 2.4 GHz only — the C6 does not do 5 GHz.</p><div class="list" id="nets"><div class="it"><span class="mut">Scanning…</span></div></div><div><label>Network name (SSID)</label><input id="ssid" value="${esc(pickSsid||C.wifi_ssid||'')}"></div><div><label>Password</label><input id="pass" type="password" autocomplete="off"></div><div id="wmsg"></div><div class="btns"><button class="g" id="rescan">Rescan</button>${C.wifi_ssid?'<button class="g" id="wskip">Keep current</button>':''}<button class="p" id="wgo">Test & continue</button></div></div>`;
  const doScan=async()=>{$('#nets').innerHTML='<div class="it"><span class="mut">Scanning…</span></div>';scan=await api('GET','/api/scan');$('#nets').innerHTML=(scan.length?scan.map(n=>`<div class="it ${n.ssid===$('#ssid').value?'sel':''}" data-s="${esc(n.ssid)}"><span>${esc(n.ssid)}</span><span class="rs">${n.open?'open':'🔒'} ${n.rssi} dBm</span></div>`).join(''):'<div class="it"><span class="mut">No networks found</span></div>')+'<div class="it" data-s=""><span class="mut">Other network…</span></div>';$('#nets').querySelectorAll('.it').forEach(i=>i.onclick=()=>{$('#ssid').value=i.dataset.s;$('#nets').querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===i));$('#pass').focus()})};
  doScan();$('#rescan').onclick=doScan;const ws=$('#wskip');if(ws)ws.onclick=()=>{step=2;render()};
  $('#wgo').onclick=async()=>{const ssid=$('#ssid').value.trim();if(!ssid)return;$('#wgo').disabled=true;$('#wmsg').innerHTML='<div class="msg warn">Connecting… stay on this hotspot, this can take up to 30 s.</div>';await api('POST','/api/wifi',{ssid,pass:$('#pass').value});
   for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,1500));try{S=await api('GET','/api/status')}catch(e){continue}header();if(S.net==='online'){$('#wmsg').innerHTML=`<div class="msg ok">Connected to ${esc(S.ssid)} · ${S.ip}</div>`;pickSsid='';setTimeout(()=>{step=2;render()},800);return}if(S.net==='fallback'){break}}
   $('#wgo').disabled=false;$('#wmsg').innerHTML='<div class="msg err">Could not connect — check the password and try again.</div>'}}
 else if(st===2){el.innerHTML=`<div class="msg ok">Connected to ${esc(S.ssid)} · ${S.ip}</div><div id="ced"></div>`;claudeEditor($('#ced'),()=>{step=3;render()})}
 else if(st===3){el.innerHTML=`<div id="oed"></div>`;openaiEditor($('#oed'),()=>{step=4;render()})}
 else{el.innerHTML=`<div class="card"><h2>All set</h2><p class="help">The display switches to the dashboard now. This page stays reachable on your home network at <code>http://tokenmeter.local</code> or <code>http://${esc(S.ip)}</code>. The setup hotspot turns off when you tap Finish.</p><div class="btns"><button class="p" id="fin">Finish</button></div></div>`;$('#fin').onclick=async()=>{await api('POST','/api/setup/done');view='usage';location.hash='';render()}}}

refresh();setInterval(()=>{const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(view==='usage'||view==='status'){if(!typing)refresh()}else{api('GET','/api/status').then(s=>{S=s;header()}).catch(()=>{})}},5000);
</script></body></html>
